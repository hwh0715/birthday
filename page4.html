<!DOCTYPE html>

<script>
(function(){
    var PASSWORD = "1222";
    if(sessionStorage.getItem('unlocked') === 'yes') return;
    document.documentElement.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a1628,#15304d);font-family:sans-serif;padding:1rem;"><div style="background:rgba(15,32,55,.9);border:1px solid rgba(150,210,255,.4);border-radius:32px;padding:2rem;max-width:360px;width:100%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:1rem;">🔒</div><div style="color:#e8f4ff;font-size:1.2rem;margin-bottom:1.5rem;">请输入密码</div><input id="pwdBox" type="password" inputmode="numeric" maxlength="20" placeholder="密码" style="width:100%;padding:1rem;border-radius:60px;border:1px solid rgba(150,210,255,.5);background:rgba(180,220,255,.08);color:#e8f4ff;font-size:1.2rem;text-align:center;letter-spacing:4px;outline:none;box-sizing:border-box;"><button id="pwdBtn" style="width:100%;margin-top:1rem;padding:1rem;border-radius:60px;border:none;background:linear-gradient(135deg,#5fa8ff,#2d7aff);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">进入</button><div id="pwdErr" style="color:#ff8fa3;font-size:.9rem;margin-top:.8rem;min-height:1.2em;"></div></div></div>';
    setTimeout(function(){
        var box = document.getElementById('pwdBox');
        var btn = document.getElementById('pwdBtn');
        var err = document.getElementById('pwdErr');
        function tryLogin(){
            if(box.value === PASSWORD){
                sessionStorage.setItem('unlocked', 'yes');
                location.reload();
            } else {
                err.textContent = '密码不对哦';
                box.value = '';
            }
        }
        btn.addEventListener('click', tryLogin);
        box.addEventListener('keydown', function(e){
            if(e.key === 'Enter') tryLogin();
        });
        box.focus();
    }, 50);
})();
</script>
<script>
(function(){
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';
    function getDeviceType(){
        var ua = navigator.userAgent;
        if(/iPad|iPhone|iPod/.test(ua)) return 'iPhone/iPad';
        if(/Android/.test(ua)) return '安卓';
        if(/Windows/.test(ua)) return 'Windows电脑';
        if(/Mac/.test(ua)) return 'Mac';
        return '其他';
    }
    window.logAction = function(action, page, extra){
        try {
            var body = {
                action: action,
                page: page || location.pathname,
                device: navigator.userAgent.substring(0, 80),
                device_type: getDeviceType()
            };
            if(extra && extra.message){ body.message_text = extra.message; }
            if(extra && extra.duration !== undefined){ body.duration_seconds = extra.duration; }
            fetch(SUPABASE_URL + '/rest/v1/logs', {
                method: 'POST',
                keepalive: true,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            }).catch(function(){});
        } catch(e){}
    };
    window.logAction('打开页面');
    var enterTime = Date.now();
    window.addEventListener('beforeunload', function(){
        var duration = Math.round((Date.now() - enterTime) / 1000);
        try {
            var data = JSON.stringify({action: '离开页面', page: location.pathname, duration_seconds: duration, device_type: getDeviceType()});
            navigator.sendBeacon(SUPABASE_URL + '/rest/v1/logs?apikey=' + SUPABASE_KEY, new Blob([data], {type: 'application/json'}));
        } catch(e){}
    });
    var hidden = false;
    document.addEventListener('visibilitychange', function(){
        if(document.hidden && !hidden){
            hidden = true;
            var duration = Math.round((Date.now() - enterTime) / 1000);
            window.logAction('离开页面', location.pathname, {duration: duration});
        } else if(!document.hidden && hidden){
            hidden = false;
            enterTime = Date.now();
            window.logAction('回到页面');
        }
    });
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.star{position:absolute;background:rgba(220,240,255,.9);border-radius:50%;box-shadow:0 0 20px rgba(150,210,255,.8);animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.card{position:relative;z-index:10;background:rgba(15,32,55,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(150,210,255,.3);border-radius:42px;padding:3rem 2rem;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 60px rgba(80,160,255,.3);animation:cardGlow 4s infinite alternate}
@keyframes cardGlow{0%{box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 40px rgba(60,140,255,.4)}100%{box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 90px rgba(100,180,255,.8)}}
.page-num{font-size:.85rem;color:#7abbff;letter-spacing:3px;margin-bottom:1rem}
.title{font-family:'Great Vibes',cursive;font-size:3rem;color:#f0f8ff;text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff;margin-bottom:.5rem}
.sub{font-size:1rem;color:#b8d4f0;margin-bottom:2rem;line-height:1.8;font-style:italic}
.record-stage{position:relative;width:260px;height:260px;margin:1rem auto 2rem;display:flex;align-items:center;justify-content:center}
.record-stage::before{content:'';position:absolute;inset:-20px;border-radius:50%;background:radial-gradient(circle,rgba(95,168,255,.35),transparent 70%);animation:haloPulse 2.5s ease-in-out infinite}
@keyframes haloPulse{0%,100%{transform:scale(1);opacity:.5}50%{transform:scale(1.15);opacity:1}}
.disc{position:relative;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,#1a2a44 25%,#0a1628 70%);border:3px solid rgba(150,210,255,.4);box-shadow:0 0 40px rgba(80,160,255,.5),inset 0 0 30px rgba(80,160,255,.3);transition:transform .4s}
.disc.playing{animation:spin 3.5s linear infinite}
@keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
.disc::before{content:'';position:absolute;inset:14px;border-radius:50%;border:1px solid rgba(150,210,255,.15)}
.disc::after{content:'';position:absolute;inset:34px;border-radius:50%;border:1px solid rgba(150,210,255,.15)}
.disc-center{position:absolute;left:50%;top:50%;width:56px;height:56px;margin-left:-28px;margin-top:-28px;border-radius:50%;background:linear-gradient(135deg,#5fa8ff,#2d7aff);box-shadow:0 0 25px #2d7aff,inset 0 0 15px rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:1.5rem;color:#fff;z-index:2}
.needle{position:absolute;top:6px;right:32px;width:60px;height:12px;background:linear-gradient(90deg,#c8d8f0,#7a9ab8);border-radius:6px;transform-origin:right center;transform:rotate(-30deg);transition:transform .6s ease-out;z-index:5;box-shadow:0 0 12px rgba(150,200,255,.5)}
.needle::before{content:'';position:absolute;left:0;top:50%;transform:translateY(-50%);width:12px;height:12px;border-radius:50%;background:#5fa8ff;box-shadow:0 0 12px #2d7aff}
.record-stage.playing .needle{transform:rotate(-8deg)}
.note{position:absolute;font-size:1.6rem;color:#9ecfff;text-shadow:0 0 15px #5fa8ff;opacity:0;pointer-events:none}
.record-stage.playing .note{animation:noteFloat 2.6s ease-out infinite}
.note.n1{left:30%;bottom:20%;animation-delay:0s}
.note.n2{left:50%;bottom:20%;animation-delay:.6s}
.note.n3{left:70%;bottom:20%;animation-delay:1.2s}
.note.n4{left:40%;bottom:20%;animation-delay:1.8s}
@keyframes noteFloat{0%{opacity:0;transform:translateY(0) scale(.6) rotate(0)}20%{opacity:1;transform:translateY(-20px) scale(1) rotate(10deg)}100%{opacity:0;transform:translateY(-150px) scale(.8) rotate(-15deg)}}
.wave{display:flex;justify-content:center;align-items:flex-end;gap:5px;height:40px;margin:1rem 0}
.wave span{width:5px;background:linear-gradient(to top,#5fa8ff,#9ecfff);border-radius:3px;height:8px;transition:height .2s}
.wave.playing span{animation:waveJump 1s ease-in-out infinite}
.wave span:nth-child(1){animation-delay:0s}
.wave span:nth-child(2){animation-delay:.1s}
.wave span:nth-child(3){animation-delay:.2s}
.wave span:nth-child(4){animation-delay:.3s}
.wave span:nth-child(5){animation-delay:.4s}
.wave span:nth-child(6){animation-delay:.5s}
.wave span:nth-child(7){animation-delay:.6s}
@keyframes waveJump{0%,100%{height:8px}50%{height:34px}}
.play-btn{display:inline-flex;align-items:center;gap:.7rem;background:linear-gradient(135deg,rgba(80,160,255,.4),rgba(45,122,255,.3));border:1px solid rgba(150,210,255,.6);border-radius:60px;padding:1rem 2.2rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:1.05rem;font-weight:600;letter-spacing:1px;user-select:none;margin-top:1rem}
.play-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.6),rgba(45,122,255,.5));transform:translateY(-2px);box-shadow:0 10px 30px rgba(60,140,255,.6)}
.play-btn:active{transform:scale(.97)}
.play-btn.playing{background:linear-gradient(135deg,rgba(100,200,255,.6),rgba(80,160,255,.5));box-shadow:0 0 30px rgba(100,180,255,.8);animation:voicePulse 1.2s infinite}
@keyframes voicePulse{0%,100%{box-shadow:0 0 20px rgba(100,180,255,.6)}50%{box-shadow:0 0 40px rgba(100,180,255,1)}}
.play-icon{font-size:1.3rem}
.hint{display:block;margin-top:.8rem;font-size:.9rem;color:#9cbedb;font-style:italic}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:2rem;flex-wrap:wrap}
.nav-btn{flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(80,160,255,.25),rgba(45,122,255,.15));border:1px solid rgba(150,210,255,.5);border-radius:60px;padding:.8rem 1.5rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:.9rem;font-weight:600;text-decoration:none}
.nav-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.5),rgba(45,122,255,.35));transform:translateY(-2px);box-shadow:0 10px 25px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(120,190,255,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
@media(max-width:600px){
.title{font-size:2.2rem}
.record-stage{width:220px;height:220px}
.disc{width:170px;height:170px}
.disc-center{width:48px;height:48px;margin-left:-24px;margin-top:-24px;font-size:1.3rem}
.needle{right:26px}
.nav-btn{font-size:.85rem}
}
</style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div id="floatBox" style="position:fixed;width:100%;height:100%;overflow:hidden;pointer-events:none;top:0;left:0;"></div>

<div class="card">
<div class="page-num">第 4 页 / 共 8 页</div>
<div class="title">一首歌，送给你</div>
<div class="sub">——--——</div>

<div class="record-stage" id="recordStage">
<div class="disc" id="disc">
<div class="disc-center">♪</div>
</div>
<div class="needle"></div>
<span class="note n1">♪</span>
<span class="note n2">♫</span>
<span class="note n3">♪</span>
<span class="note n4">♬</span>
</div>

<div class="wave" id="wave">
<span></span><span></span><span></span><span></span><span></span><span></span><span></span>
</div>

<div class="play-btn" id="playBtn">
<span class="play-icon" id="playIcon">▶</span>
<span id="playText">点我播放</span>
</div>
<span class="hint" id="hint">这首歌，是我想对你说的话</span>

<audio id="songAudio" preload="auto" loop>
<source src="song.mp3" type="audio/mpeg">
你的浏览器不支持音频播放。
</audio>

<div class="nav">
<a href="page3.html" class="nav-btn">← 上一页</a>
<a href="page5.html" class="nav-btn">翻开下一页 →</a>
</div>
</div>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['💙','✨','💎','🌊','☁️','💠','🩵'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#playBtn') || e.target.closest('#recordStage')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','💙','🎈','💠'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });

    var playBtn = document.getElementById('playBtn');
    var playIcon = document.getElementById('playIcon');
    var playText = document.getElementById('playText');
    var songAudio = document.getElementById('songAudio');
    var disc = document.getElementById('disc');
    var recordStage = document.getElementById('recordStage');
    var wave = document.getElementById('wave');
    var hint = document.getElementById('hint');
    var playing = false;

    playBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(playing){
            songAudio.pause();
            playIcon.textContent = '▶';
            playText.textContent = '点我播放';
            playBtn.classList.remove('playing');
            disc.classList.remove('playing');
            recordStage.classList.remove('playing');
            wave.classList.remove('playing');
            hint.textContent = '这首歌，是我想对你说的话';
            playing = false;
        } else {
            songAudio.play().then(function(){
                playIcon.textContent = '⏸';
                playText.textContent = '正在播放...';
                playBtn.classList.add('playing');
                disc.classList.add('playing');
                recordStage.classList.add('playing');
                wave.classList.add('playing');
                hint.textContent = '🎵 在听了，别切歌 ——';
                playing = true;
                window.logAction('播放了歌');
            }).catch(function(err){
                playText.textContent = '加载失败，检查 song.mp3';
                console.error(err);
            });
        }
    });

    songAudio.addEventListener('ended', function(){
        playIcon.textContent = '▶';
        playText.textContent = '点我播放';
        playBtn.classList.remove('playing');
        disc.classList.remove('playing');
        recordStage.classList.remove('playing');
        wave.classList.remove('playing');
        hint.textContent = '这首歌，是我想对你说的话';
        playing = false;
    });
})();
</script>
</body>
</html>
