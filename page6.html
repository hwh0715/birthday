<script>
(function(){
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';
    function getDeviceType(){
        var ua = navigator.userAgent;
        if(/iPad|iPhone|iPod/.test(ua)) return 'iPhone/iPad';
        if(/Android/.test(ua)) return '安卓';
        if(/Windows/.test(ua)) return 'Windows电脑';
        if(/Mac/.test(ua)) return 'Mac';
        return '其他';
    }
    window.logAction = function(action, page, extra){
        try {
            var body = {
                action: action,
                page: page || location.pathname,
                device: navigator.userAgent.substring(0, 80),
                device_type: getDeviceType()
            };
            if(extra && extra.message){ body.message_text = extra.message; }
            if(extra && extra.duration !== undefined){ body.duration_seconds = extra.duration; }
            fetch(SUPABASE_URL + '/rest/v1/logs', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            }).catch(function(){});
        } catch(e){}
    };
    window.logAction('打开页面');
    var enterTime = Date.now();
    window.addEventListener('beforeunload', function(){
        var duration = Math.round((Date.now() - enterTime) / 1000);
        try {
            var data = JSON.stringify({action: '离开页面', page: location.pathname, duration_seconds: duration, device_type: getDeviceType()});
            navigator.sendBeacon(SUPABASE_URL + '/rest/v1/logs?apikey=' + SUPABASE_KEY, new Blob([data], {type: 'application/json'}));
        } catch(e){}
    });
    var hidden = false;
    document.addEventListener('visibilitychange', function(){
        if(document.hidden && !hidden){
            hidden = true;
            var duration = Math.round((Date.now() - enterTime) / 1000);
            window.logAction('离开页面', location.pathname, {duration: duration});
        } else if(!document.hidden && hidden){
            hidden = false;
            enterTime = Date.now();
            window.logAction('回到页面');
        }
    });
})();
</script>
<style>

body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}

.page-num{font-size:.85rem;color:#7abbff;letter-spacing:3px;margin-bottom:1rem}
.final-title{font-family:'Great Vibes',cursive;font-size:3.5rem;color:#f0f8ff;text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff,0 0 80px #2d7aff;line-height:1.2;margin-bottom:1.5rem;animation:textPulse 3s infinite}
@keyframes textPulse{0%,100%{text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff,0 0 60px #2d7aff}50%{text-shadow:0 0 30px #b8dcff,0 0 70px #7abbff,0 0 100px #1a5eff}}

.final-btn{display:inline-flex;align-items:center;gap:.7rem;background:linear-gradient(135deg,rgba(100,200,255,.4),rgba(45,122,255,.3));border:1px solid rgba(180,220,255,.7);border-radius:60px;padding:1.2rem 2.5rem;cursor:pointer;transition:all .3s;color:#f0f8ff;font-size:1.2rem;font-weight:700;letter-spacing:1px;user-select:none;margin:1rem 0;box-shadow:0 0 30px rgba(80,160,255,.4)}

.final-btn:active{transform:scale(.96)}
.final-btn.activated{background:linear-gradient(135deg,rgba(255,200,100,.5),rgba(255,160,80,.4));border-color:rgba(255,220,180,.8);box-shadow:0 0 40px rgba(255,200,120,.8)}
.surprise-box{max-height:0;overflow:hidden;transition:max-height 1s ease,padding .5s;margin-top:1rem}
.surprise-box.open{max-height:600px;padding:1rem 0}
.surprise-content{background:rgba(255,220,235,.1);border:2px dashed rgba(255,200,220,.6);border-radius:20px;padding:1.5rem;color:#f0f8ff;font-size:1.05rem;line-height:2}
.surprise-content .big{font-family:'Great Vibes',cursive;font-size:2rem;color:#d6ecff;text-shadow:0 0 20px #5fa8ff;display:block;margin-bottom:.8rem}
.surprise-content .line{border-top:1px dashed rgba(255,200,220,.4);margin:1rem 0;padding-top:1rem;font-style:italic;color:#b8d4f0}
.signature{font-family:'Great Vibes',cursive;font-size:2rem;color:#a8d8ff;margin-top:1.5rem;text-shadow:0 0 20px #2d7aff}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
.nav-btn{flex:1;min-width:120px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(80,160,255,.25),rgba(45,122,255,.15));border:1px solid rgba(150,210,255,.5);border-radius:60px;padding:.8rem 1.5rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:.95rem;font-weight:600;text-decoration:none}
.nav-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.5),rgba(45,122,255,.35));transform:translateY(-2px);box-shadow:0 10px 25px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(120,190,255,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
.firework{position:fixed;pointer-events:none;z-index:999;font-size:2rem;animation:fwBurst 1.8s ease-out forwards}
@keyframes fwBurst{0%{opacity:1;transform:translate(0,0) scale(0)}50%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.8)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3)}}
@media(max-width:600px){.final-title{font-size:2.6rem}.final-msg{font-size:1rem}.final-btn{font-size:1rem;padding:1rem 1.8rem}.signature{font-size:1.6rem}.nav-btn{font-size:.85rem}}

<body>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['💙','✨','💎','🌊','☁️','💠','🩵'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#finalBtn')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','💙','🎈','💠'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });

    var finalBtn = document.getElementById('finalBtn');
    var surpriseBox = document.getElementById('surpriseBox');
    var opened = false;
    finalBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(opened) return;
        opened = true;
        finalBtn.textContent = '💙 生日快乐，诗曼 💙';
        finalBtn.classList.add('activated');
        surpriseBox.classList.add('open');
        window.logAction('拆开了终极惊喜');

        for(var i=0;i<60;i++){
            (function(idx){
                setTimeout(function(){
                    var h = document.createElement('div');
                    h.className = 'floating-heart';
                    h.textContent = ['💙','💖','✨','🌸','💗','🩵','💎'][Math.floor(Math.random()*7)];
                    h.style.left = Math.random()*100+'%';
                    h.style.top = '-50px';
                    h.style.fontSize = (Math.random()*1.8+1.2)+'rem';
                    h.style.animation = 'floatUp '+(Math.random()*3+4)+'s linear forwards';
                    h.style.animationDelay = (Math.random()*1.5)+'s';
                    h.style.opacity = '0.95';
                    document.body.appendChild(h);
                    setTimeout(function(){ h.remove(); }, 9000);
                }, idx*60);
            })(i);
        }

        for(var k=0;k<5;k++){
            (function(idx){
                setTimeout(function(){
                    var cx = window.innerWidth * (0.2 + Math.random()*0.6);
                    var cy = window.innerHeight * (0.2 + Math.random()*0.5);
                    for(var m=0;m<24;m++){
                        (function(mi){
                            setTimeout(function(){
                                var f = document.createElement('div');
                                f.className = 'firework';
                                f.textContent = ['✨','⭐','💙','🌟','💫','💠'][Math.floor(Math.random()*6)];
                                f.style.left = cx+'px';
                                f.style.top = cy+'px';
                                var angle = (Math.PI*2/24)*mi;
                                var dist = 100 + Math.random()*150;
                                f.style.setProperty('--tx', Math.cos(angle)*dist+'px');
                                f.style.setProperty('--ty', Math.sin(angle)*dist+'px');
                                document.body.appendChild(f);
                                setTimeout(function(){ f.remove(); }, 1800);
                            }, mi*20);
                        })(m);
                    }
                }, idx*600);
            })(k);
        }
    });
})();
</script>
</body>
