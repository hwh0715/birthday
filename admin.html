<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>后台 · 操作日志</title>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628,#15304d);font-family:'Quicksand',sans-serif;padding:1rem}
.card{max-width:720px;margin:0 auto;background:rgba(15,32,55,.85);border:1px solid rgba(150,210,255,.3);border-radius:32px;padding:2rem;box-shadow:0 30px 60px rgba(0,0,0,.6)}
.title{font-size:1.8rem;color:#f0f8ff;text-align:center;margin-bottom:.4rem;text-shadow:0 0 20px #5fa8ff}
.sub{text-align:center;color:#9cbedb;font-size:.9rem;margin-bottom:1.5rem}
.pwd-input{width:100%;padding:1rem 1.5rem;border-radius:60px;border:1px solid rgba(150,210,255,.5);background:rgba(180,220,255,.08);color:#e8f4ff;font-size:1.1rem;text-align:center;letter-spacing:4px;outline:none;font-family:'Quicksand',sans-serif;margin-bottom:1rem}
.pwd-input:focus{border-color:#5fa8ff;box-shadow:0 0 20px rgba(95,168,255,.5)}
.btn{display:block;width:100%;padding:1rem;border-radius:60px;border:1px solid rgba(150,210,255,.6);background:linear-gradient(135deg,rgba(80,160,255,.4),rgba(45,122,255,.3));color:#e8f4ff;font-size:1rem;font-weight:600;letter-spacing:1px;cursor:pointer;transition:all .3s;font-family:'Quicksand',sans-serif}
.btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.6),rgba(45,122,255,.5));transform:translateY(-2px)}
.btn.small{width:auto;display:inline-block;padding:.6rem 1.5rem;font-size:.9rem;margin:.3rem .2rem}
.error{color:#ff8fa3;text-align:center;font-size:.9rem;margin-top:.8rem;min-height:1.2em}
.stats{display:flex;gap:1rem;margin-bottom:1rem;flex-wrap:wrap}
.stat{flex:1;min-width:120px;background:rgba(180,220,255,.08);border:1px dashed rgba(150,200,255,.5);border-radius:16px;padding:1rem;text-align:center}
.stat-label{color:#9cbedb;font-size:.8rem;letter-spacing:1px}
.stat-num{font-size:2rem;font-weight:700;color:#7abbff;margin-top:.3rem;text-shadow:0 0 15px #2d7aff}
.log-box{max-height:500px;overflow-y:auto;background:rgba(0,0,0,.2);border-radius:16px;padding:1rem;margin-top:1rem}
.log-item{padding:.8rem;border-bottom:1px dashed rgba(150,200,255,.15);color:#cce6ff;font-size:.9rem;display:flex;justify-content:space-between;gap:1rem;flex-wrap:wrap}
.log-item:last-child{border-bottom:none}
.log-action{color:#7abbff;font-weight:600}
.log-time{color:#9cbedb;font-size:.8rem}
.log-page{color:#b8d4f0;font-size:.8rem}
.actions{text-align:center;margin-top:1rem}
.hide{display:none}
</style>
</head>
<body>
<div class="card">
    <div class="title">🔐 后台 · 操作日志</div>
    <div class="sub">韦诗曼生日网页 · 访客行为记录</div>

    <div id="loginArea">
        <input type="password" class="pwd-input" id="pwdInput" placeholder="管理密码" maxlength="30">
        <button class="btn" id="loginBtn">进入后台</button>
        <div class="error" id="errorMsg"></div>
    </div>

    <div id="dashArea" class="hide">
        <div class="stats">
            <div class="stat">
                <div class="stat-label">总日志条数</div>
                <div class="stat-num" id="totalCount">--</div>
            </div>
            <div class="stat">
                <div class="stat-label">打开页面次数</div>
                <div class="stat-num" id="pageViewCount">--</div>
            </div>
            <div class="stat">
                <div class="stat-label">最近活动</div>
                <div class="stat-num" id="lastTime" style="font-size:.95rem">--</div>
            </div>
        </div>
        <div class="actions">
            <button class="btn small" id="refreshBtn">🔄 刷新</button>
        </div>
        <div class="log-box" id="logBox">加载中...</div>
    </div>
</div>

<script>
(function(){
    // ===== 管理密码，改这里 =====
    var PASSWORD = "admin2026";
    // ===========================
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';

    var loginArea = document.getElementById('loginArea');
    var dashArea = document.getElementById('dashArea');
    var pwdInput = document.getElementById('pwdInput');
    var loginBtn = document.getElementById('loginBtn');
    var errorMsg = document.getElementById('errorMsg');
    var logBox = document.getElementById('logBox');
    var totalCount = document.getElementById('totalCount');
    var pageViewCount = document.getElementById('pageViewCount');
    var lastTime = document.getElementById('lastTime');
    var refreshBtn = document.getElementById('refreshBtn');

    function loadLogs(){
        logBox.textContent = '加载中...';
        fetch(SUPABASE_URL + '/rest/v1/logs?select=*&order=time.desc&limit=200', {
            headers: {
                'apikey': SUPABASE_KEY,
                'Authorization': 'Bearer ' + SUPABASE_KEY
            }
        })
        .then(function(r){ return r.json(); })
        .then(function(data){
            if(!Array.isArray(data)){
                logBox.textContent = '读取失败：' + JSON.stringify(data);
                return;
            }
            totalCount.textContent = data.length;
            var pv = data.filter(function(d){ return d.action === '打开页面'; }).length;
            pageViewCount.textContent = pv;
            if(data[0] && data[0].time){
                var t = new Date(data[0].time);
                lastTime.textContent = t.toLocaleString('zh-CN');
            }
            if(data.length === 0){
                logBox.innerHTML = '<div class="log-item">暂时没有日志～</div>';
                return;
            }
            var html = '';
            data.forEach(function(d){
                var t = new Date(d.time).toLocaleString('zh-CN');
                html += '<div class="log-item">'
                    + '<div><span class="log-action">' + (d.action || '未知') + '</span> '
                    + '<span class="log-page">' + (d.page || '') + '</span></div>'
                    + '<div class="log-time">' + t + '</div>'
                    + '</div>';
            });
            logBox.innerHTML = html;
        })
        .catch(function(err){
            logBox.textContent = '加载失败：' + err.message;
        });
    }

    loginBtn.addEventListener('click', function(){
        if(pwdInput.value === PASSWORD){
            loginArea.classList.add('hide');
            dashArea.classList.remove('hide');
            loadLogs();
        } else {
            errorMsg.textContent = '密码不对哦';
            pwdInput.value = '';
        }
    });

    pwdInput.addEventListener('keydown', function(e){
        if(e.key === 'Enter') loginBtn.click();
    });

    refreshBtn.addEventListener('click', loadLogs);
})();
</script>
</body>
</html>
