<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<script>
(function(){
    var PASSWORD = "1222";
    if(sessionStorage.getItem('unlocked') === 'yes') return;
    document.documentElement.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a1628,#15304d);font-family:sans-serif;padding:1rem;"><div style="background:rgba(15,32,55,.9);border:1px solid rgba(150,210,255,.4);border-radius:32px;padding:2rem;max-width:360px;width:100%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:1rem;">🔒</div><div style="color:#e8f4ff;font-size:1.2rem;margin-bottom:1.5rem;">请输入密码</div><input id="pwdBox" type="password" inputmode="numeric" maxlength="20" placeholder="密码" style="width:100%;padding:1rem;border-radius:60px;border:1px solid rgba(150,210,255,.5);background:rgba(180,220,255,.08);color:#e8f4ff;font-size:1.2rem;text-align:center;letter-spacing:4px;outline:none;box-sizing:border-box;"><button id="pwdBtn" style="width:100%;margin-top:1rem;padding:1rem;border-radius:60px;border:none;background:linear-gradient(135deg,#5fa8ff,#2d7aff);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">进入</button><div id="pwdErr" style="color:#ff8fa3;font-size:.9rem;margin-top:.8rem;min-height:1.2em;"></div></div></div>';
    setTimeout(function(){
        var box = document.getElementById('pwdBox');
        var btn = document.getElementById('pwdBtn');
        var err = document.getElementById('pwdErr');
        function tryLogin(){
            if(box.value === PASSWORD){
                sessionStorage.setItem('unlocked', 'yes');
                location.reload();
            } else {
                err.textContent = '密码不对哦';
                box.value = '';
            }
        }
        btn.addEventListener('click', tryLogin);
        box.addEventListener('keydown', function(e){
            if(e.key === 'Enter') tryLogin();
        });
        box.focus();
    }, 50);
})();
</script>
<script>
(function(){
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';
    function getDeviceType(){
        var ua = navigator.userAgent;
        if(/iPad|iPhone|iPod/.test(ua)) return 'iPhone/iPad';
        if(/Android/.test(ua)) return '安卓';
        if(/Windows/.test(ua)) return 'Windows电脑';
        if(/Mac/.test(ua)) return 'Mac';
        return '其他';
    }
    window.logAction = function(action, page, extra){
        try {
            var body = {
                action: action,
                page: page || location.pathname,
                device: navigator.userAgent.substring(0, 80),
                device_type: getDeviceType()
            };
            if(extra && extra.message){ body.message_text = extra.message; }
            if(extra && extra.duration !== undefined){ body.duration_seconds = extra.duration; }
            fetch(SUPABASE_URL + '/rest/v1/logs', {
                method: 'POST',
                keepalive: true,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            }).catch(function(){});
        } catch(e){}
    };
    window.logAction('打开页面');
    var enterTime = Date.now();
    window.addEventListener('beforeunload', function(){
        var duration = Math.round((Date.now() - enterTime) / 1000);
        try {
            var data = JSON.stringify({action: '离开页面', page: location.pathname, duration_seconds: duration, device_type: getDeviceType()});
            navigator.sendBeacon(SUPABASE_URL + '/rest/v1/logs?apikey=' + SUPABASE_KEY, new Blob([data], {type: 'application/json'}));
        } catch(e){}
    });
    var hidden = false;
    document.addEventListener('visibilitychange', function(){
        if(document.hidden && !hidden){
            hidden = true;
            var duration = Math.round((Date.now() - enterTime) / 1000);
            window.logAction('离开页面', location.pathname, {duration: duration});
        } else if(!document.hidden && hidden){
            hidden = false;
            enterTime = Date.now();
            window.logAction('回到页面');
        }
    });
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.star{position:absolute;background:rgba(220,240,255,.9);border-radius:50%;box-shadow:0 0 20px rgba(150,210,255,.8);animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.card{position:relative;z-index:10;background:rgba(15,32,55,.7);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(150,210,255,.3);border-radius:42px;padding:3rem 2rem;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 60px rgba(80,160,255,.3);animation:cardGlow 4s infinite alternate}
@keyframes cardGlow{0%{box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 40px rgba(60,140,255,.4)}100%{box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 90px rgba(100,180,255,.8)}}
.page-num{font-size:.85rem;color:#7abbff;letter-spacing:3px;margin-bottom:1rem}
.date-badge{display:inline-block;font-weight:600;font-size:.9rem;letter-spacing:4px;color:#cce6ff;background:rgba(80,160,255,.25);padding:.5rem 1.6rem;border-radius:60px;border:1px solid rgba(150,210,255,.5);margin-bottom:1.5rem}
.name{font-family:'Great Vibes',cursive;font-size:4rem;color:#f0f8ff;text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff,0 0 80px #2d7aff;line-height:1.2;margin-bottom:1rem;animation:textPulse 3s infinite}
@keyframes textPulse{0%,100%{text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff,0 0 60px #2d7aff}50%{text-shadow:0 0 30px #b8dcff,0 0 70px #7abbff,0 0 100px #1a5eff}}
.cake-area{margin:1.5rem auto;cursor:pointer;user-select:none;transition:transform .3s}
.cake-area:hover{transform:scale(1.05)}
.cake-area:active{transform:scale(.95)}
.cake{font-size:5rem;filter:drop-shadow(0 0 20px rgba(120,190,255,.8));transition:filter .5s}
.cake.blown{filter:drop-shadow(0 0 30px rgba(255,230,150,1)) brightness(1.3)}
.cake-hint{font-size:.9rem;color:#b8d4f0;margin-top:.3rem;letter-spacing:1px;animation:hintPulse 2s infinite}
@keyframes hintPulse{0%,100%{opacity:.5}50%{opacity:1}}
.birthday-pop{font-family:'Great Vibes',cursive;font-size:2.5rem;color:#d6ecff;text-shadow:0 0 20px #5fa8ff,0 0 40px #2d7aff;margin-top:.5rem;animation:popIn .6s ease-out}
@keyframes popIn{0%{transform:scale(0);opacity:0}70%{transform:scale(1.2)}100%{transform:scale(1);opacity:1}}
.msg{font-size:1.2rem;line-height:2;color:#e8f4ff;margin:1.5rem 0;text-shadow:0 2px 10px rgba(100,170,255,.5)}
.msg .hl{font-weight:700;font-size:1.4rem;display:inline-block;background:linear-gradient(135deg,#a8d8ff,#5fa8ff);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:.5rem}
.next-btn{display:inline-flex;align-items:center;gap:.6rem;background:linear-gradient(135deg,rgba(80,160,255,.35),rgba(45,122,255,.25));border:1px solid rgba(150,210,255,.6);border-radius:60px;padding:.9rem 2rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:1.05rem;font-weight:600;letter-spacing:1px;text-decoration:none;margin-top:.5rem}
.next-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.55),rgba(45,122,255,.4));transform:translateY(-2px);box-shadow:0 10px 30px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(120,190,255,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
@media(max-width:600px){.name{font-size:3rem}.cake{font-size:3.5rem}.msg{font-size:1rem}}
</style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div id="floatBox" style="position:fixed;width:100%;height:100%;overflow:hidden;pointer-events:none;top:0;left:0;"></div>

<div class="card">
<div class="page-num">第 1 页 / 共 8 页</div>
<div class="date-badge">✨ 生日快乐 ✨</div>
<div class="name">韦诗曼</div>

<div class="cake-area" id="cakeArea">
<div class="cake" id="cakeEmoji">🎂</div>
<div class="cake-hint" id="cakeHint">👆 点一下蛋糕</div>
<div id="birthdayPop"></div>
</div>

<div class="msg">
<span class="hl">今天，是你的生日</span><br>
我准备了几页小惊喜给你
</div>

<a href="page2.html" class="next-btn">翻开第 2 页 →</a>
</div>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['💙','✨','💎','🌊','☁️','💠','🩵'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#cakeArea')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','💙','🎈','💠'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });
    var cakeArea = document.getElementById('cakeArea');
    var cakeEmoji = document.getElementById('cakeEmoji');
    var cakeHint = document.getElementById('cakeHint');
    var birthdayPop = document.getElementById('birthdayPop');
    var blown = false;
    cakeArea.addEventListener('click', function(e){
        e.stopPropagation();
        if(blown) return;
        blown = true;
        cakeEmoji.textContent = '🕯️';
        cakeEmoji.classList.add('blown');
        cakeHint.style.display = 'none';
        birthdayPop.innerHTML = '<div class="birthday-pop">诗曼，生日快乐 🎉</div>';
        window.logAction('点了蛋糕');
        for(var i=0;i<20;i++){
            (function(idx){
                setTimeout(function(){
                    var c = document.createElement('div');
                    c.textContent = ['🎉','🎊','✨','💙','🌟'][Math.floor(Math.random()*5)];
                    c.style.position = 'fixed';
                    c.style.left = (window.innerWidth/2 + (Math.random()-.5)*300)+'px';
                    c.style.top = '50%';
                    c.style.fontSize = (Math.random()*1.5+1)+'rem';
                    c.style.pointerEvents = 'none';
                    c.style.zIndex = '999';
                    c.style.transition = 'all 1.5s ease-out';
                    document.body.appendChild(c);
                    setTimeout(function(){
                        c.style.transform = 'translate('+((Math.random()-.5)*400)+'px,'+(-Math.random()*400)+'px) rotate('+(Math.random()*720)+'deg)';
                        c.style.opacity = '0';
                    }, 50);
                    setTimeout(function(){ c.remove(); }, 1600);
                }, idx*60);
            })(i);
        }
    });
})();
</script>
</body>
</html>
