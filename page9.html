<script>
(function(){
    var PASSWORD = "1222";
    if(sessionStorage.getItem('unlocked') === 'yes') return;
    document.documentElement.innerHTML = '<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(145deg,#0a1628,#15304d);font-family:sans-serif;padding:1rem;"><div style="background:rgba(15,32,55,.9);border:1px solid rgba(150,210,255,.4);border-radius:32px;padding:2rem;max-width:360px;width:100%;text-align:center;"><div style="font-size:2.5rem;margin-bottom:1rem;">🔒</div><div style="color:#e8f4ff;font-size:1.2rem;margin-bottom:1.5rem;">请输入密码</div><input id="pwdBox" type="password" inputmode="numeric" maxlength="20" placeholder="密码" style="width:100%;padding:1rem;border-radius:60px;border:1px solid rgba(150,210,255,.5);background:rgba(180,220,255,.08);color:#e8f4ff;font-size:1.2rem;text-align:center;letter-spacing:4px;outline:none;box-sizing:border-box;"><button id="pwdBtn" style="width:100%;margin-top:1rem;padding:1rem;border-radius:60px;border:none;background:linear-gradient(135deg,#5fa8ff,#2d7aff);color:#fff;font-size:1rem;font-weight:700;cursor:pointer;">进入</button><div id="pwdErr" style="color:#ff8fa3;font-size:.9rem;margin-top:.8rem;min-height:1.2em;"></div></div></div>';
    setTimeout(function(){
        var box = document.getElementById('pwdBox');
        var btn = document.getElementById('pwdBtn');
        var err = document.getElementById('pwdErr');
        function tryLogin(){
            if(box.value === PASSWORD){
                sessionStorage.setItem('unlocked', 'yes');
                location.reload();
            } else {
                err.textContent = '密码不对哦';
                box.value = '';
            }
        }
        btn.addEventListener('click', tryLogin);
        box.addEventListener('keydown', function(e){
            if(e.key === 'Enter') tryLogin();
        });
        box.focus();
    }, 50);
})();
</script>
<script>
(function(){
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';
    function getDeviceType(){
        var ua = navigator.userAgent;
        if(/iPad|iPhone|iPod/.test(ua)) return 'iPhone/iPad';
        if(/Android/.test(ua)) return '安卓';
        if(/Windows/.test(ua)) return 'Windows电脑';
        if(/Mac/.test(ua)) return 'Mac';
        return '其他';
    }
    window.logAction = function(action, page, extra){
        try {
            var body = {
                action: action,
                page: page || location.pathname,
                device: navigator.userAgent.substring(0, 80),
                device_type: getDeviceType()
            };
            if(extra && extra.message){ body.message_text = extra.message; }
            if(extra && extra.duration !== undefined){ body.duration_seconds = extra.duration; }
            fetch(SUPABASE_URL + '/rest/v1/logs', {
                method: 'POST',
                keepalive: true,
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            }).catch(function(){});
        } catch(e){}
    };
    window.logAction('打开页面');
    var enterTime = Date.now();
    window.addEventListener('beforeunload', function(){
        var duration = Math.round((Date.now() - enterTime) / 1000);
        try {
            var data = JSON.stringify({action: '离开页面', page: location.pathname, duration_seconds: duration, device_type: getDeviceType()});
            navigator.sendBeacon(SUPABASE_URL + '/rest/v1/logs?apikey=' + SUPABASE_KEY, new Blob([data], {type: 'application/json'}));
        } catch(e){}
    });
    var hidden = false;
    document.addEventListener('visibilitychange', function(){
        if(document.hidden && !hidden){
            hidden = true;
            var duration = Math.round((Date.now() - enterTime) / 1000);
            window.logAction('离开页面', location.pathname, {duration: duration});
        } else if(!document.hidden && hidden){
            hidden = false;
            enterTime = Date.now();
            window.logAction('回到页面');
        }
    });
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}

.card{position:relative;z-index:10;background:rgba(15,32,55,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(150,210,255,.3);border-radius:42px;padding:2.5rem 2rem;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 60px rgba(80,160,255,.3);animation:cardGlow 4s infinite alternate}
@keyframes cardGlow{0%{box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 40px rgba(60,140,255,.4)}100%{box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 90px rgba(100,180,255,.8)}}
.page-num{font-size:.85rem;color:#7abbff;letter-spacing:3px;margin-bottom:1rem}
.title{font-family:'Great Vibes',cursive;font-size:3rem;color:#f0f8ff;text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff;margin-bottom:.5rem}
.sub{font-size:.95rem;color:#b8d4f0;margin-bottom:1.5rem;line-height:1.8;font-style:italic}
.input-box{background:rgba(180,220,255,.08);border:1px solid rgba(150,200,255,.4);border-radius:20px;padding:1.2rem;margin-bottom:1.2rem}
textarea{width:100%;min-height:90px;background:rgba(10,20,40,.5);border:1px solid rgba(150,200,255,.3);border-radius:14px;padding:1rem;color:#e8f4ff;font-size:1rem;font-family:'Quicksand',sans-serif;resize:vertical;outline:none;line-height:1.7}
textarea:focus{border-color:#5fa8ff;box-shadow:0 0 20px rgba(95,168,255,.4)}
textarea::placeholder{color:#7a9ab8}
.send-btn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(255,80,110,.5),rgba(200,40,80,.4));border:1px solid rgba(255,150,180,.6);border-radius:60px;padding:.9rem 2rem;cursor:pointer;color:#fff;font-size:1rem;font-weight:700;letter-spacing:1px;user-select:none;margin-top:1rem;transition:all .3s;font-family:'Quicksand',sans-serif;width:100%}
.send-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(255,80,130,.5)}

.msg-list{max-height:320px;overflow-y:auto;text-align:left;margin-top:1rem}
.msg-list::-webkit-scrollbar{width:4px}
.msg-list::-webkit-scrollbar-thumb{background:rgba(150,200,255,.4);border-radius:4px}
.msg-item{background:rgba(180,220,255,.08);border:1px solid rgba(150,200,255,.25);border-radius:16px;padding:1rem 1.2rem;margin-bottom:.8rem;color:#e8f4ff;font-size:.95rem;line-height:1.7;animation:popIn .5s ease-out;word-break:break-word}
.msg-item .time{display:block;font-size:.75rem;color:#7a9ab8;margin-top:.5rem;text-align:right}
.msg-empty{color:#7a9ab8;font-size:.9rem;text-align:center;padding:1.5rem;font-style:italic}
@keyframes popIn{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
.nav-btn{flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(80,160,255,.25),rgba(45,122,255,.15));border:1px solid rgba(150,210,255,.5);border-radius:60px;padding:.8rem 1.5rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:.9rem;font-weight:600;text-decoration:none}
.nav-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.5),rgba(45,122,255,.35));transform:translateY(-2px);box-shadow:0 10px 25px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(255,120,160,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
.heart-rain{position:fixed;pointer-events:none;z-index:997;font-size:2rem;animation:rainFall 4s ease-in forwards}
@keyframes rainFall{0%{opacity:1;transform:translateY(-10vh) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(360deg)}}
@media(max-width:600px){.title{font-size:2.2rem}.nav-btn{font-size:.85rem}}
</style>

<body>
<div class="stars" id="starsContainer"></div>
<div id="floatBox" style="position:fixed;width:100%;height:100%;overflow:hidden;pointer-events:none;top:0;left:0;"></div>

<div class="card">
<div class="page-num">第 9 页 / 共 9 页 · 最后一页</div>
<div class="title">想对你说的话</div>
<div class="sub">—— 这里留给你 ——<br>想说什么，都可以写下来</div>

<div class="input-box">
<textarea id="msgInput" placeholder="写点什么吧，开心的、想说的、悄悄话都可以……"></textarea>
<button class="send-btn" id="sendBtn">💙 写好了，存下来</button>
</div>

<div class="msg-list" id="msgList"></div>

<div class="nav">
<a href="page8.html" class="nav-btn">← 上一页</a>
<a href="index.html" class="nav-btn">🔄 再看一遍</a>
</div>
</div>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['❤️','✨','💗','🌹','💖','🌺','💕'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#sendBtn') || e.target.closest('textarea')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','❤️','🎈','💗'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });

    var msgInput = document.getElementById('msgInput');
    var sendBtn = document.getElementById('sendBtn');
    var msgList = document.getElementById('msgList');
    var STORE_KEY = 'weishiman_messages';

    function getMessages(){
        try {
            var raw = localStorage.getItem(STORE_KEY);
            return raw ? JSON.parse(raw) : [];
        } catch(e){ return []; }
    }
    function saveMessages(arr){
        try { localStorage.setItem(STORE_KEY, JSON.stringify(arr)); } catch(e){}
    }
    function render(){
        var arr = getMessages();
        if(arr.length === 0){
            msgList.innerHTML = '<div class="msg-empty">还没有留言，写下第一句吧 ✨</div>';
            return;
        }
        var html = '';
        for(var i=arr.length-1;i>=0;i--){
            var m = arr[i];
            html += '<div class="msg-item">' + escapeHtml(m.text) + '<span class="time">' + m.time + '</span></div>';
        }
        msgList.innerHTML = html;
    }
    function escapeHtml(s){
        return String(s).replace(/[&<>"']/g, function(c){
            return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
        });
    }

    sendBtn.addEventListener('click', function(e){
        e.stopPropagation();
        var text = msgInput.value.trim();
        if(!text){
            msgInput.focus();
            return;
        }
        var arr = getMessages();
        var now = new Date();
        var t = now.getFullYear() + '-' +
                String(now.getMonth()+1).padStart(2,'0') + '-' +
                String(now.getDate()).padStart(2,'0') + ' ' +
                String(now.getHours()).padStart(2,'0') + ':' +
                String(now.getMinutes()).padStart(2,'0');
        arr.push({ text: text, time: t });
        saveMessages(arr);
        msgInput.value = '';
        render();
        window.logAction('写了一条留言', 'page9.html', {message: text});

        for(var i=0;i<10;i++){
            (function(idx){
                setTimeout(function(){
                    var h = document.createElement('div');
                    h.className = 'heart-rain';
                    h.textContent = ['❤️','💖','✨','💗','💝'][Math.floor(Math.random()*5)];
                    h.style.left = Math.random()*100+'%';
                    h.style.animationDuration = (Math.random()*1.5+2)+'s';
                    h.style.fontSize = (Math.random()*1+1.2)+'rem';
                    document.body.appendChild(h);
                    setTimeout(function(){ h.remove(); }, 4000);
                }, idx*60);
            })(i);
        }
    });

    render();
})();
</script>
</body>
</html>
