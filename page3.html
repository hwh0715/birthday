<script>
(function(){
    var SUPABASE_URL = 'https://yichqkjqthbixfmevysp.supabase.co';
    var SUPABASE_KEY = 'sb_publishable_RfxI1hpkigYR00BOhkmDTw_YUPq6YYx';
    function getDeviceType(){
        var ua = navigator.userAgent;
        if(/iPad|iPhone|iPod/.test(ua)) return 'iPhone/iPad';
        if(/Android/.test(ua)) return '安卓';
        if(/Windows/.test(ua)) return 'Windows电脑';
        if(/Mac/.test(ua)) return 'Mac';
        return '其他';
    }
    window.logAction = function(action, page, extra){
        try {
            var body = {
                action: action,
                page: page || location.pathname,
                device: navigator.userAgent.substring(0, 80),
                device_type: getDeviceType()
            };
            if(extra && extra.message){ body.message_text = extra.message; }
            if(extra && extra.duration !== undefined){ body.duration_seconds = extra.duration; }
            fetch(SUPABASE_URL + '/rest/v1/logs', {
                method: 'POST',
                headers: {
                    'apikey': SUPABASE_KEY,
                    'Authorization': 'Bearer ' + SUPABASE_KEY,
                    'Content-Type': 'application/json',
                    'Prefer': 'return=minimal'
                },
                body: JSON.stringify(body)
            }).catch(function(){});
        } catch(e){}
    };
    window.logAction('打开页面');
    var enterTime = Date.now();
    window.addEventListener('beforeunload', function(){
        var duration = Math.round((Date.now() - enterTime) / 1000);
        try {
            var data = JSON.stringify({action: '离开页面', page: location.pathname, duration_seconds: duration, device_type: getDeviceType()});
            navigator.sendBeacon(SUPABASE_URL + '/rest/v1/logs?apikey=' + SUPABASE_KEY, new Blob([data], {type: 'application/json'}));
        } catch(e){}
    });
    var hidden = false;
    document.addEventListener('visibilitychange', function(){
        if(document.hidden && !hidden){
            hidden = true;
            var duration = Math.round((Date.now() - enterTime) / 1000);
            window.logAction('离开页面', location.pathname, {duration: duration});
        } else if(!document.hidden && hidden){
            hidden = false;
            enterTime = Date.now();
            window.logAction('回到页面');
        }
    });
})();
</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}
.stars{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.star{position:absolute;background:rgba(220,240,255,.9);border-radius:50%;box-shadow:0 0 20px rgba(150,210,255,.8);animation:twinkle 3s infinite ease-in-out}
@keyframes twinkle{0%,100%{opacity:.2;transform:scale(.8)}50%{opacity:1;transform:scale(1.2)}}
.card{position:relative;z-index:10;background:rgba(15,32,55,.75);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(150,210,255,.3);border-radius:42px;padding:2.8rem 2rem;max-width:620px;width:100%;text-align:center;box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 60px rgba(80,160,255,.3);animation:cardGlow 4s infinite alternate}
@keyframes cardGlow{0%{box-shadow:0 30px 50px rgba(0,0,0,.6),0 0 40px rgba(60,140,255,.4)}100%{box-shadow:0 30px 60px rgba(0,0,0,.8),0 0 90px rgba(100,180,255,.8)}}
.page-num{font-size:.85rem;color:#7abbff;letter-spacing:3px;margin-bottom:1rem}
.title{font-family:'Great Vibes',cursive;font-size:3rem;color:#f0f8ff;text-shadow:0 0 20px #9ecfff,0 0 40px #5fa8ff;margin-bottom:.5rem}
.sub{font-size:.95rem;color:#b8d4f0;margin-bottom:2rem;line-height:1.8;font-style:italic}
.timeline{position:relative;padding:1rem 0;margin-bottom:1.5rem}
.timeline::before{content:'';position:absolute;left:50%;top:0;bottom:0;width:2px;background:linear-gradient(to bottom,rgba(150,210,255,.1),rgba(150,210,255,.6),rgba(150,210,255,.1));transform:translateX(-50%)}
.tl-item{position:relative;margin-bottom:2rem;opacity:0;transform:translateY(30px);transition:all .8s ease-out}
.tl-item.show{opacity:1;transform:translateY(0)}
.tl-dot{position:absolute;left:50%;top:20px;width:14px;height:14px;background:#ff6b8b;border-radius:50%;transform:translateX(-50%);box-shadow:0 0 15px #ff3b70;z-index:2}
.tl-dot::after{content:'';position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,107,139,.4);animation:pulse 2s infinite}
@keyframes pulse{0%{transform:scale(1);opacity:1}100%{transform:scale(1.6);opacity:0}}
.tl-content{background:rgba(180,220,255,.08);border:1px solid rgba(150,200,255,.3);border-radius:20px;padding:1.2rem 1.5rem;width:calc(50% - 30px);text-align:left;position:relative;transition:all .3s}
.tl-content:hover{background:rgba(180,220,255,.15);border-color:rgba(150,210,255,.6);box-shadow:0 10px 30px rgba(80,160,255,.3)}
.tl-item:nth-child(odd) .tl-content{margin-left:auto;text-align:right}
.tl-time{font-size:.8rem;color:#7abbff;letter-spacing:2px;margin-bottom:.4rem;font-weight:600}
.tl-text{font-size:.95rem;color:#e8f4ff;line-height:1.8}
.tl-text .hl{color:#ff9eb5;font-weight:600}
.ending{font-family:'Great Vibes',cursive;font-size:1.8rem;color:#ff9eb5;text-shadow:0 0 20px #ff3b70;line-height:1.6;margin-top:1rem;animation:textPulse 3s infinite}
@keyframes textPulse{0%,100%{text-shadow:0 0 20px #ff9eb5,0 0 40px #ff6f9c}50%{text-shadow:0 0 30px #ffb8cd,0 0 70px #ff7aa2}}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
.nav-btn{flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(80,160,255,.25),rgba(45,122,255,.15));border:1px solid rgba(150,210,255,.5);border-radius:60px;padding:.8rem 1.5rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:.9rem;font-weight:600;text-decoration:none}
.nav-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.5),rgba(45,122,255,.35));transform:translateY(-2px);box-shadow:0 10px 25px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(255,120,160,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
.firework{position:fixed;pointer-events:none;z-index:999;font-size:2rem;animation:fwBurst 1.8s ease-out forwards}
@keyframes fwBurst{0%{opacity:1;transform:translate(0,0) scale(0)}50%{opacity:1;transform:translate(var(--tx),var(--ty)) scale(1.8)}100%{opacity:0;transform:translate(var(--tx),var(--ty)) scale(.3)}}
.heart-rain{position:fixed;pointer-events:none;z-index:997;font-size:2rem;animation:rainFall 4s ease-in forwards}
@keyframes rainFall{0%{opacity:1;transform:translateY(-10vh) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(360deg)}}
.egg-btn{display:inline-flex;align-items:center;gap:.5rem;background:linear-gradient(135deg,rgba(255,80,110,.4),rgba(200,40,80,.3));border:1px solid rgba(255,150,180,.6);border-radius:60px;padding:.8rem 1.8rem;cursor:pointer;color:#fff;font-size:.95rem;font-weight:600;letter-spacing:1px;user-select:none;margin-top:1.2rem;transition:all .3s}
.egg-btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(255,80,130,.5)}
.egg-btn:active{transform:scale(.97)}
@media(max-width:600px){
.title{font-size:2.2rem}
.timeline::before{left:20px}
.tl-dot{left:20px}
.tl-content{width:calc(100% - 50px);margin-left:50px !important;text-align:left !important}
.ending{font-size:1.5rem}
.nav-btn{font-size:.85rem}
}
</style>
</head>
<body>
<div class="stars" id="starsContainer"></div>
<div id="floatBox" style="position:fixed;width:100%;height:100%;overflow:hidden;pointer-events:none;top:0;left:0;"></div>

<div class="card">
<div class="page-num">第 3 页 / 共 8 页</div>
<div class="title">我们的时光</div>
<div class="sub">—— 有些瞬间，我一直记着 ——</div>

<div class="timeline" id="timeline">
    <div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-content">
            <div class="tl-time">第一次见你</div>
            <div class="tl-text">那天我其实有点紧张，但看到你笑的那一下，就。<span class="hl">你的笑，是我那天记得最清楚的事。</span></div>
        </div>
    </div>
    <div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-content">
            <div class="tl-time">第一次牵手</div>
            <div class="tl-text">心跳快得不行，还假装很淡定。<span class="hl">你手心的温度，我现在还记得。</span></div>
        </div>
    </div>
    <div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-content">
            <div class="tl-time">你笑的那天</div>
            <div class="tl-text">真的，<span class="hl">你笑起来的样子，比我见过的任何风景都好看。</span>我当时偷偷看了好久。</div>
        </div>
    </div>
    <div class="tl-item">
        <div class="tl-dot"></div>
        <div class="tl-content">
            <div class="tl-time">今天</div>
            <div class="tl-text">是你的生日。<span class="hl">谢谢你出现在我的世界里。</span>以后的每个日子，我都想陪你走。</div>
        </div>
    </div>
</div>

<div class="ending">
    诗曼，遇见你，是我最好的运气。
</div>

<button class="egg-btn" id="eggBtn">💙 点我，有句话想对你说</button>

<div class="nav">
<a href="page2.html" class="nav-btn">← 上一页</a>
<a href="page4.html" class="nav-btn">翻开第 4 页 →</a>
</div>
</div>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['❤️','✨','💗','🌹','💖','🌺','💕'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#eggBtn') || e.target.closest('.nav-btn')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','❤️','🎈','💗'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });

    var items = document.querySelectorAll('.tl-item');
    function checkShow(){
        var trigger = window.innerHeight * 0.85;
        items.forEach(function(el){
            var top = el.getBoundingClientRect().top;
            if(top < trigger && !el.classList.contains('shown-log')){
                el.classList.add('shown-log');
                var time = el.querySelector('.tl-time');
                window.logAction('看了时间轴：' + (time ? time.textContent : ''), 'page3.html');
            }
            if(top < trigger){ el.classList.add('show'); }
        });
    }
    window.addEventListener('scroll', checkShow);
    window.addEventListener('resize', checkShow);
    setTimeout(checkShow, 200);

    var eggBtn = document.getElementById('eggBtn');
    var eggTriggered = false;
    eggBtn.addEventListener('click', function(e){
        e.stopPropagation();
        if(eggTriggered) return;
        eggTriggered = true;
        eggBtn.textContent = '💙 我也爱你，诗曼 💙';
        window.logAction('点了悄悄话彩蛋');

        var ending = document.querySelector('.ending');
        ending.innerHTML = '不管以后是晴天还是雨天<br>我都想站在你旁边。';

        for(var k=0;k<50;k++){
            (function(idx){
                setTimeout(function(){
                    var hr = document.createElement('div');
                    hr.className = 'heart-rain';
                    hr.textContent = ['❤️','💖','✨','🌹','💗','💕','💝'][Math.floor(Math.random()*7)];
                    hr.style.left = Math.random()*100+'%';
                    hr.style.animationDuration = (Math.random()*2+3)+'s';
                    hr.style.animationDelay = (Math.random()*1.2)+'s';
                    hr.style.fontSize = (Math.random()*1.5+1.5)+'rem';
                    document.body.appendChild(hr);
                    setTimeout(function(){ hr.remove(); }, 6000);
                }, idx*70);
            })(k);
        }
        for(var w=0;w<3;w++){
            (function(wi){
                setTimeout(function(){
                    var cx = window.innerWidth * (0.2 + Math.random()*0.6);
                    var cy = window.innerHeight * (0.2 + Math.random()*0.5);
                    for(var m=0;m<24;m++){
                        (function(mi){
                            setTimeout(function(){
                                var fw = document.createElement('div');
                                fw.className = 'firework';
                                fw.textContent = ['✨','⭐','❤️','🌟','💫','💖'][Math.floor(Math.random()*6)];
                                fw.style.left = cx+'px';
                                fw.style.top = cy+'px';
                                var angle = (Math.PI*2/24)*mi;
                                var dist = 100 + Math.random()*150;
                                fw.style.setProperty('--tx', Math.cos(angle)*dist+'px');
                                fw.style.setProperty('--ty', Math.sin(angle)*dist+'px');
                                document.body.appendChild(fw);
                                setTimeout(function(){ fw.remove(); }, 1800);
                            }, mi*20);
                        })(m);
                    }
                }, wi*700);
            })(w);
        }
    });
})();
</script>
</body>
</html>
