<style>
*{margin:0;padding:0;box-sizing:border-box}
body{min-height:100vh;background:linear-gradient(145deg,#0a1628 0%,#0f2540 40%,#15304d 100%);display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;overflow-x:hidden;padding:1rem;position:relative}

.game{position:relative;width:100%;max-width:440px;height:400px;margin:0 auto;background:radial-gradient(ellipse at 50% 40%,#0d1d33 0%,#050a14 100%);border:1px solid rgba(150,210,255,.35);border-radius:24px;overflow:hidden;box-shadow:0 0 40px rgba(80,160,255,.2) inset}

.result-box .score-big{font-size:2.5rem;font-weight:700;color:#7abbff;text-shadow:0 0 25px #2d7aff;margin:.5rem 0}
.result-box .text{color:#e8f4ff;font-size:.95rem;line-height:1.8;margin-bottom:1rem}
.result-box .gift{background:rgba(255,220,150,.12);border:2px dashed rgba(255,200,120,.6);border-radius:20px;padding:1.2rem;margin:1rem 0}
.result-box .gift .icon{font-size:3rem;display:block;margin-bottom:.4rem}
.result-box .gift .name{font-size:1.3rem;font-weight:700;color:#ffd93d;text-shadow:0 0 15px #ffb800;display:block;margin-bottom:.3rem}
.result-box .gift .desc{color:#e8f4ff;font-size:.9rem;line-height:1.7}
.result-box .tip{margin-top:.6rem;font-size:.85rem;color:#9cbedb;font-style:italic}
.nav{display:flex;justify-content:space-between;gap:1rem;margin-top:1.5rem;flex-wrap:wrap}
.nav-btn{flex:1;min-width:110px;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:linear-gradient(135deg,rgba(80,160,255,.25),rgba(45,122,255,.15));border:1px solid rgba(150,210,255,.5);border-radius:60px;padding:.8rem 1.5rem;cursor:pointer;transition:all .3s;color:#e8f4ff;font-size:.9rem;font-weight:600;text-decoration:none}
.nav-btn:hover{background:linear-gradient(135deg,rgba(80,160,255,.5),rgba(45,122,255,.35));transform:translateY(-2px);box-shadow:0 10px 25px rgba(60,140,255,.5)}
.balloon{position:fixed;pointer-events:none;z-index:998;font-size:2.5rem;animation:balloonRise 4s ease-out forwards}
@keyframes balloonRise{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-400px) scale(1.3)}}
.floating-heart{position:fixed;color:rgba(120,190,255,.35);font-size:2rem;user-select:none;pointer-events:none;animation:floatUp 12s infinite linear;z-index:1}
@keyframes floatUp{0%{transform:translateY(100vh) rotate(0);opacity:0}10%{opacity:.6}90%{opacity:.6}100%{transform:translateY(-20vh) rotate(360deg);opacity:0}}
.confetti{position:fixed;pointer-events:none;z-index:999;font-size:1.5rem;animation:confettiFall 3s ease-in forwards}
@keyframes confettiFall{0%{opacity:1;transform:translateY(-10vh) rotate(0)}100%{opacity:0;transform:translateY(110vh) rotate(720deg)}}
@media(max-width:600px){.title{font-size:2.1rem}.game{height:340px}.nav-btn{font-size:.85rem}}
</style>

<body>
<div class="stars" id="starsContainer"></div>
<div id="floatBox" style="position:fixed;width:100%;height:100%;overflow:hidden;pointer-events:none;top:0;left:0;"></div>

<div class="status">
<div class="status-item"><div class="status-label">得分</div><div class="status-num" id="score">0</div></div>
<div class="status-item"><div class="status-label">时间</div><div class="status-num" id="time">30</div></div>
<div class="status-item"><div class="status-label">最高</div><div class="status-num" id="best">0</div></div>
</div>

<div class="game" id="game">
<div class="overlay" id="startOverlay">
<h3>准备好了吗？</h3>
<p>点<b>爱心 💙</b> +1 分<br>点<b>炸弹 💣</b> -2 分<br>限时 <b>30 秒</b>，看看你能打多少分</p>

<div class="text" id="resultText">……</div>

<span class="icon">🎁</span>
<span class="name" id="giftName">神秘礼物</span>
<div class="desc" id="giftDesc">……</div>

</div>

</div>

<script>
(function(){
    var sc = document.getElementById('starsContainer');
    for(var i=0;i<80;i++){
        var s = document.createElement('div');
        s.className = 'star';
        var sz = Math.random()*6+2;
        s.style.width = sz+'px'; s.style.height = sz+'px';
        s.style.left = Math.random()*100+'%'; s.style.top = Math.random()*100+'%';
        s.style.animationDelay = Math.random()*5+'s';
        s.style.animationDuration = (Math.random()*4+2)+'s';
        if(Math.random()>.6){ s.style.background='rgba(200,230,255,.9)'; s.style.boxShadow='0 0 20px rgba(120,190,255,.9)'; }
        sc.appendChild(s);
    }
    var fb = document.getElementById('floatBox');
    var ha = ['💙','✨','💎','🌊','☁️','💠','🩵'];
    for(var j=0;j<18;j++){
        var f = document.createElement('div');
        f.className = 'floating-heart';
        f.textContent = ha[Math.floor(Math.random()*ha.length)];
        f.style.fontSize = (Math.random()*2+1.2)+'rem';
        f.style.left = Math.random()*100+'%';
        f.style.animationDuration = (Math.random()*8+8)+'s';
        f.style.animationDelay = Math.random()*12+'s';
        f.style.opacity = Math.random()*.4+.2;
        fb.appendChild(f);
    }
    document.addEventListener('click', function(e){
        if(e.target.closest('#game') || e.target.closest('#result') || e.target.closest('.btn')) return;
        var b = document.createElement('div');
        b.className = 'balloon';
        b.textContent = ['🎈','🎈','💙','🎈','💠'][Math.floor(Math.random()*5)];
        b.style.left = (e.clientX-20)+'px';
        b.style.top = (e.clientY-20)+'px';
        document.body.appendChild(b);
        setTimeout(function(){ b.remove(); }, 4000);
    });

    var game = document.getElementById('game');
    var startOverlay = document.getElementById('startOverlay');
    var startBtn = document.getElementById('startBtn');
    var scoreEl = document.getElementById('score');
    var timeEl = document.getElementById('time');
    var bestEl = document.getElementById('best');
    var result = document.getElementById('result');
    var finalScore = document.getElementById('finalScore');
    var resultText = document.getElementById('resultText');
    var giftName = document.getElementById('giftName');
    var giftDesc = document.getElementById('giftDesc');
    var againBtn = document.getElementById('againBtn');

    var GAME_TIME = 30;
    var HOLE_COUNT = 9;
    var score = 0;
    var timeLeft = GAME_TIME;
    var best = parseInt(localStorage.getItem('moleBest') || '0');
    bestEl.textContent = best;

    var playing = false;
    var holes = [];
    var timer = null;
    var spawnTimer = null;
    var activeMoles = [];

    var gifts = [
        { icon:'🎁', name:'一顿火锅', desc:'你说想吃什么就吃什么，我请客。' },
        { icon:'🎬', name:'一场电影', desc:'你选片，我买票，爆米花管够。' },
        { icon:'🧋', name:'一杯奶茶', desc:'糖度你定，加料也行。' },
        { icon:'🌊', name:'一次看海', desc:'等有空，我们去看一次海。' },
        { icon:'🍰', name:'一个蛋糕', desc:'生日嘛，蛋糕不能少。' },
        { icon:'🎤', name:'一首歌', desc:'点一首，我唱给你听。' },
        { icon:'🎮', name:'陪你打游戏', desc:'你想玩什么，我陪你玩到赢。' },
        { icon:'☕', name:'一次约会', desc:'地点你挑，时间你定。' }
    ];

    function buildHoles(){
        holes = [];
        var rows = 3, cols = 3;
        for(var r=0;r<rows;r++){
            for(var c=0;c<cols;c++){
                var x = (c + 0.5) / cols * 100;
                var y = (r + 0.5) / rows * 100;
                holes.push({x: x, y: y});
            }
        }
    }

    function buildHoleVisuals(){
        var old = game.querySelectorAll('.hole');
        for(var i=0;i<old.length;i++) old[i].remove();
        holes.forEach(function(h){
            var hole = document.createElement('div');
            hole.className = 'hole';
            hole.style.left = h.x + '%';
            hole.style.top = h.y + '%';
            game.appendChild(hole);
        });
    }

    function spawnMole(){
        if(!playing) return;
        var used = {};
        activeMoles.forEach(function(m){ used[m.holeIndex] = true; });
        var free = [];
        for(var i=0;i<holes.length;i++){
            if(!used[i]) free.push(i);
        }
        if(free.length === 0) return;

        var holeIndex = free[Math.floor(Math.random()*free.length)];
        var h = holes[holeIndex];
        var isBomb = Math.random() < 0.2;

        var mole = document.createElement('div');
        mole.className = 'mole ' + (isBomb ? 'bomb' : 'heart');
        mole.textContent = isBomb ? '💣' : '💙';
        mole.style.left = h.x + '%';
        mole.style.top = h.y + '%';
        game.appendChild(mole);
        setTimeout(function(){ mole.classList.add('up'); }, 20);

        var obj = { el: mole, holeIndex: holeIndex, isBomb: isBomb, dead: false };
        activeMoles.push(obj);

        var lifetime = 900 + Math.random() * 700;
        setTimeout(function(){
            if(obj.dead) return;
            obj.dead = true;
            mole.classList.remove('up');
            setTimeout(function(){ mole.remove(); }, 200);
            removeActive(obj);
        }, lifetime);

        mole.addEventListener('click', function(e){
            e.stopPropagation();
            if(obj.dead || !playing) return;
            obj.dead = true;
            if(isBomb){
                score -= 2;
                if(score < 0) score = 0;
                scoreEl.textContent = score;
                scoreEl.classList.add('danger');
                setTimeout(function(){ scoreEl.classList.remove('danger'); }, 400);
                showFloat(mole, '-2', '#ff6b8b');
                mole.classList.add('boom');
                window.logAction('点到炸弹 -2，当前 ' + score + '分');
                setTimeout(function(){ mole.remove(); }, 400);
            } else {
                score += 1;
                scoreEl.textContent = score;
                showFloat(mole, '+1', '#7affb0');
                mole.classList.add('boom');
                window.logAction('点到爱心 +1，当前 ' + score + '分');
                setTimeout(function(){ mole.remove(); }, 400);
            }
            removeActive(obj);
        });
    }

    function removeActive(obj){
        var idx = activeMoles.indexOf(obj);
        if(idx > -1) activeMoles.splice(idx, 1);
    }

    function showFloat(el, text, color){
        var f = document.createElement('div');
        f.className = 'float-point';
        f.textContent = text;
        f.style.color = color;
        f.style.left = el.style.left;
        f.style.top = el.style.top;
        f.style.textShadow = '0 0 10px ' + color;
        game.appendChild(f);
        setTimeout(function(){ f.remove(); }, 1000);
    }

    function startGame(){
        score = 0;
        timeLeft = GAME_TIME;
        scoreEl.textContent = '0';
        timeEl.textContent = GAME_TIME;
        scoreEl.classList.remove('danger');
        timeEl.classList.remove('danger');
        activeMoles.forEach(function(m){ m.el.remove(); });
        activeMoles = [];
        startOverlay.style.display = 'none';
        result.classList.remove('show');
        playing = true;

        buildHoles();
        buildHoleVisuals();

        if(timer) clearInterval(timer);
        timer = setInterval(function(){
            timeLeft--;
            timeEl.textContent = timeLeft;
            if(timeLeft <= 5){ timeEl.classList.add('danger'); }
            if(timeLeft <= 0){ endGame(); }
        }, 1000);

        if(spawnTimer) clearInterval(spawnTimer);
        spawnTimer = setInterval(function(){
            if(!playing) return;
            var count = 1;
            if(timeLeft < 20 && Math.random() < 0.4) count = 2;
            if(timeLeft < 10 && Math.random() < 0.5) count = 2;
            for(var i=0;i<count;i++){ spawnMole(); }
        }, 700);

        window.logAction('开始打地鼠游戏');
    }

    function endGame(){
        playing = false;
        if(timer) clearInterval(timer);
        if(spawnTimer) clearInterval(spawnTimer);
        activeMoles.forEach(function(m){ m.el.remove(); });
        activeMoles = [];

        if(score > best){
            best = score;
            localStorage.setItem('moleBest', best);
            bestEl.textContent = best;
        }

        window.logAction('游戏结束，得分 ' + score);

        finalScore.textContent = score;
        if(score >= 22){
            resultText.innerHTML = '厉害！你打了 <b style="color:#ffd93d">' + score + '</b> 分<br>比我预期的还多。';
        } else if(score >= 10){
            resultText.innerHTML = '不错哦，打了 <b style="color:#ffd93d">' + score + '</b> 分<br>再来一次说不定更高。';
        } else {
            resultText.innerHTML = '打了 <b style="color:#ffd93d">' + score + '</b> 分<br>没关系，开心就好。';
        }

        var g = gifts[Math.floor(Math.random()*gifts.length)];
        giftName.textContent = g.name;
        giftDesc.textContent = g.desc;
        window.logAction('抽到礼物：' + g.name);

        result.classList.add('show');

        for(var k=0;k<40;k++){
            (function(idx){
                setTimeout(function(){
                    var cf = document.createElement('div');
                    cf.className = 'confetti';
                    cf.textContent = ['🎉','🎊','✨','🎁','💙','⭐','🎈'][Math.floor(Math.random()*7)];
                    cf.style.left = Math.random()*100+'%';
                    cf.style.animationDuration = (Math.random()*1.5+2)+'s';
                    cf.style.animationDelay = (Math.random()*1)+'s';
                    cf.style.fontSize = (Math.random()*1+1.2)+'rem';
                    document.body.appendChild(cf);
                    setTimeout(function(){ cf.remove(); }, 4000);
                }, idx*50);
            })(k);
        }
    }

    startBtn.addEventListener('click', startGame);
    againBtn.addEventListener('click', function(e){
        e.stopPropagation();
        result.classList.remove('show');
        startOverlay.style.display = 'flex';
        buildHoles();
        buildHoleVisuals();
    });
})();
</script>
</body>
</html>
